<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#57ab5a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Frog Pond">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Frog Pond — for Rose</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif; background:#e8fbe8; color:#173d1f; text-align:center; }
  header { background:linear-gradient(135deg,#a7f3b8,#bfeee8); padding:12px 10px 10px; box-shadow:0 2px 8px rgba(0,0,0,.10); }
  header h1 { margin:0; font-size:1.5rem; }
  #counter { margin:4px 0 0; font-size:1.1rem; font-weight:bold; color:#0b7a43; }
  main { max-width:560px; margin:0 auto; padding:14px 12px 30px; }
  #modebar { display:flex; gap:10px; justify-content:center; margin:2px 0 12px; }
  .modebtn { font-size:1.15rem; font-weight:bold; padding:13px 20px; border-radius:999px; border:3px solid #57ab5a; background:#fff; color:#0b7a43; font-family:inherit; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.10); }
  .modebtn.on { background:#57ab5a; color:#fff; }
  #buddy { font-size:3.6rem; line-height:1; cursor:pointer; display:inline-block; animation:bob 2.4s ease-in-out infinite; background:none; border:none; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  #prompt { font-size:1.3rem; font-weight:bold; margin:6px 0 2px; min-height:1.6em; }
  #problem { font-size:2.6rem; font-weight:bold; letter-spacing:.06em; margin:2px 0 0; min-height:1.25em; color:#0b5394; }
  #pond { position:relative; background:radial-gradient(ellipse at 50% 40%, #8fd8ff 0%, #4fb3e8 55%, #2e8fd0 100%); border:6px solid #57ab5a; border-radius:48% / 38%; min-height:340px; margin:14px auto 6px; max-width:480px; cursor:pointer; overflow:hidden; box-shadow:inset 0 0 40px rgba(255,255,255,.35), 0 6px 16px rgba(0,0,0,.15); transition:box-shadow .3s; }
  #pond.glow { box-shadow:0 0 0 6px #ffe066, 0 0 34px 10px rgba(255,214,64,.75); }
  .pad { position:absolute; font-size:2rem; opacity:.85; pointer-events:none; }
  .frog { position:absolute; transform:translate(-50%,-50%); background:none; border:none; cursor:pointer; padding:0; line-height:1; text-align:center; transition:transform .55s ease, opacity .55s ease; }
  .frog .face { font-size:3.2rem; display:block; border-radius:50%; padding:2px; }
  .frog.grpB .face { background:rgba(255,170,60,.55); box-shadow:0 0 0 3px rgba(255,140,0,.65); }
  .frog .num { display:block; margin-top:1px; font-size:1.05rem; font-weight:bold; color:#fff; background:#0b7a43; border-radius:999px; padding:1px 9px; box-shadow:0 2px 5px rgba(0,0,0,.25); }
  .frog .counttag { position:absolute; top:-12px; right:-8px; font-size:1.1rem; font-weight:bold; color:#fff; background:#ff8c42; border:2px solid #fff; border-radius:999px; padding:2px 9px; box-shadow:0 2px 5px rgba(0,0,0,.3); }
  .frog.hop .face { animation:hop .55s ease; }
  @keyframes hop { 30%{transform:translateY(-22px) scale(1.12);} 60%{transform:translateY(2px) scale(.96);} }
  .frog.wiggle .face { animation:wiggle .45s ease infinite alternate; }
  @keyframes wiggle { from{transform:rotate(-5deg)} to{transform:rotate(5deg)} }
  .frog.leaving { transform:translate(-50%,-260%); opacity:0; }
  .splash { position:absolute; transform:translate(-50%,-50%); font-size:2rem; pointer-events:none; animation:splashUp .6s ease forwards; }
  @keyframes splashUp { from{opacity:1; transform:translate(-50%,-50%) scale(.7);} to{opacity:0; transform:translate(-50%,-110%) scale(1.3);} }
  .controls { margin-top:20px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .controls[hidden] { display:none; }
  .bigbtn { font-size:1.25rem; font-weight:bold; padding:16px 24px; border:none; border-radius:999px; font-family:inherit; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.18); }
  .bigbtn.count { background:#3d9bff; color:#fff; font-size:1.4rem; padding:18px 30px; }
  .bigbtn.again { background:#ffb84d; color:#5a3400; }
  .bigbtn.newprob { background:#57ab5a; color:#fff; font-size:1.4rem; padding:18px 30px; }
  .bigbtn.showme { background:#ff8c42; color:#fff; font-size:1.4rem; padding:18px 30px; }
  .bigbtn.again.highlight, .bigbtn.newprob.highlight { box-shadow:0 0 0 6px #ffe066, 0 3px 8px rgba(0,0,0,.18); }
  .bigbtn:disabled { opacity:.45; }
  .confetti { position:fixed; top:-16px; width:13px; height:13px; border-radius:3px; z-index:50; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(105vh) rotate(720deg); opacity:.85; } }
  footer { padding:8px 12px 30px; }
</style>
</head>
<body>
<header>
  <h1>🐸 Frog Pond 🐸</h1>
  <p id="counter">Frogs: 0</p>
</header>
<main>
  <div id="modebar">
    <button class="modebtn on" id="modeCountBtn">🐸 Count</button>
    <button class="modebtn" id="modeMathBtn">🧮 Frog Math</button>
  </div>
  <button id="buddy" title="Tap me!">🐸</button>
  <div id="prompt">Tap the pond!</div>
  <div id="problem"></div>
  <div id="pond" aria-label="Pond"></div>
  <div class="controls" id="countUI">
    <button class="bigbtn count" id="countBtn" disabled>🔊 Count with me!</button>
    <button class="bigbtn again" id="againBtn">🔄 Again!</button>
  </div>
  <div class="controls" id="mathUI" hidden>
    <button class="bigbtn newprob" id="newProbBtn">▶️ New problem!</button>
    <button class="bigbtn showme" id="showMeBtn" disabled>👀 Show me!</button>
  </div>
</main>
<footer>
<p><button id="installBtn" onclick="installApp()" style="display:none;font-size:1rem;padding:10px 18px;border:none;border-radius:999px;background:#57ab5a;color:#fff;font-family:inherit;cursor:pointer">📱 Install this app</button></p>
<script>
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; const b = document.getElementById("installBtn"); if (b) b.style.display = "inline-block"; });
function installApp(){ if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.then(() => { deferredInstall = null; const b = document.getElementById("installBtn"); if (b) b.style.display = "none"; }); } }
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) return;
    if (sessionStorage.getItem("fpSwReloaded")) return;
    sessionStorage.setItem("fpSwReloaded", "1");
    location.reload();
  });
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</footer>
<script>
"use strict";
// Frog Pond — Count & Croak (v1) + Frog Math (v2).
// COUNT: tap the pond, a frog hops in and says its number; at 10 they all
// count together. FROG MATH (Amanda picked say-it-out-loud, Oct 18 2026):
// a problem is narrated and acted out — frogs hop IN for addition, hop AWAY
// for subtraction — Rose says the answer out loud, then Show Me counts the
// frogs with her and reveals it. No answer buttons, no wrong state anywhere.
// Audio is pre-recorded Aria MP3s only — never SpeechSynthesis. Silent until
// the first tap.
const SPOTS = [
  [22,30],[50,22],[78,30],[35,48],[65,48],[22,68],[50,62],[78,68],[38,84],[64,84]
];
const PADS = [[14,52],[86,50],[50,40],[84,86],[14,14]];
const pond = document.getElementById("pond");
const counterEl = document.getElementById("counter");
const promptEl = document.getElementById("prompt");
const problemEl = document.getElementById("problem");
const countBtn = document.getElementById("countBtn");
const againBtn = document.getElementById("againBtn");
const newProbBtn = document.getElementById("newProbBtn");
const showMeBtn = document.getElementById("showMeBtn");
const countUI = document.getElementById("countUI");
const mathUI = document.getElementById("mathUI");
let mode = "count";
let frogs = [];           // frog elements currently in the pond, in order
let celebrating = false;  // count-mode celebration running
let busy = false;         // math narration/animation running
let player = null;
let seqToken = 0;         // increments to cancel any chained playback

PADS.forEach(([x,y]) => {
  const s = document.createElement("span");
  s.className = "pad"; s.textContent = "🪷";
  s.style.left = x + "%"; s.style.top = y + "%";
  pond.appendChild(s);
});

function stopAudio() {
  seqToken += 1;
  if (player) { try { player.pause(); } catch(e) {} player = null; }
}
function play(file, onend) {
  stopAudio();
  const a = new Audio("audio/" + file);
  player = a;
  if (onend) a.addEventListener("ended", onend, { once:true });
  a.play().catch(() => { if (onend) setTimeout(onend, 350); });
  return a;
}
// Play clips back-to-back; stale chains (mode switch, reset, new tap) abort.
function playSeq(files, token, onDone, gapMs) {
  let i = 0;
  const step = () => {
    if (token !== seqToken) return;
    if (i >= files.length) { if (onDone) onDone(); return; }
    const a = new Audio("audio/" + files[i]);
    player = a; i += 1;
    let advanced = false;
    const next = () => { if (!advanced) { advanced = true; setTimeout(step, gapMs || 120); } };
    a.addEventListener("ended", next, { once:true });
    a.play().catch(() => setTimeout(next, 400));
    setTimeout(next, 6000); // safety: never hang a chain on a stuck clip
  };
  step();
}
function confetti(n) {
  const colors = ["#2ec4b6","#ffe066","#ff8fb8","#8fc9ff","#57ab5a","#ffb84d"];
  for (let i = 0; i < (n || 44); i++) {
    const d = document.createElement("div");
    d.className = "confetti";
    d.style.left = Math.random() * 100 + "vw";
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = (1.4 + Math.random() * 1.6) + "s";
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 3400);
  }
}
function hop(el) {
  el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop");
}
function splash(x, y) {
  const s = document.createElement("span");
  s.className = "splash"; s.textContent = "💦";
  s.style.left = x + "%"; s.style.top = y + "%";
  pond.appendChild(s);
  setTimeout(() => s.remove(), 650);
}
function updateCounter() { counterEl.textContent = "Frogs: " + frogs.length; }
function makeFrog(spotIdx, opts) {
  opts = opts || {};
  const [x, y] = SPOTS[spotIdx % SPOTS.length];
  const b = document.createElement("button");
  b.className = "frog" + (opts.grpB ? " grpB" : "");
  b.style.left = x + "%"; b.style.top = y + "%";
  let inner = '<span class="face">🐸</span>';
  if (opts.badge) inner += '<span class="num">' + opts.badge + "</span>";
  b.innerHTML = inner;
  b.addEventListener("click", ev => { ev.stopPropagation(); onFrogTap(b); });
  pond.appendChild(b);
  splash(x, y);
  hop(b);
  frogs.push(b);
  updateCounter();
  return b;
}
function clearPond() {
  frogs.forEach(f => f.remove());
  frogs = [];
  pond.classList.remove("glow");
  updateCounter();
}

// ---------------- COUNT MODE (v1, unchanged behavior) ----------------
function addFrog() {
  if (celebrating || frogs.length >= 10) return;
  const b = makeFrog(frogs.length, { badge: frogs.length + 1 });
  b.dataset.n = String(frogs.length);
  if (frogs.length === 10) {
    play("num_10.mp3", () => setTimeout(celebrate, 250));
  } else {
    play("num_" + frogs.length + ".mp3");
    promptEl.textContent = frogs.length >= 7 ? "Almost there!" : "Tap the pond!";
  }
  countBtn.disabled = false;
}
function celebrate() {
  if (celebrating) return;
  celebrating = true;
  promptEl.textContent = "You did it! Ten frogs!";
  pond.classList.add("glow");
  frogs.forEach(f => f.classList.add("wiggle"));
  confetti();
  againBtn.classList.add("highlight");
  play("count_together.mp3", () => play("praise_did_it.mp3", () => play("ribbit.mp3")));
}
function resetCount() {
  stopAudio();
  celebrating = false;
  clearPond();
  againBtn.classList.remove("highlight");
  promptEl.textContent = "Tap the pond!";
  problemEl.textContent = "";
  countBtn.disabled = true;
}

// ---------------- FROG MATH MODE (v2) ----------------
// Rose taps frogs to count them: each new frog she touches gets the next
// count tag and says that number. Tags reset every problem and every Show Me.
let math = null; // {a, b, op, answer, phase}
let tapOrder = new Map();
let tapCount = 0;
function resetTapCounts() {
  tapOrder = new Map(); tapCount = 0;
  frogs.forEach(f => { const t = f.querySelector(".counttag"); if (t) t.remove(); });
}
function tagFrog(f, n) {
  let t = f.querySelector(".counttag");
  if (!t) { t = document.createElement("span"); t.className = "counttag"; f.appendChild(t); }
  t.textContent = String(n);
}
function onFrogTap(f) {
  if (mode === "count") {
    if (celebrating) return;
    hop(f);
    if (f.dataset.n) play("num_" + f.dataset.n + ".mp3");
    return;
  }
  // math mode
  if (busy || !math || math.phase !== "asking") return;
  hop(f);
  if (tapOrder.has(f)) { play("num_" + tapOrder.get(f) + ".mp3"); return; }
  tapCount += 1;
  tapOrder.set(f, tapCount);
  tagFrog(f, tapCount);
  play("num_" + tapCount + ".mp3");
}
function spawnStaggered(count, grpB, token, done) {
  let i = 0;
  const step = () => {
    if (token !== seqToken) return;
    if (i >= count) { if (done) done(); return; }
    makeFrog(frogs.length, { grpB: grpB });
    i += 1;
    setTimeout(step, 280);
  };
  step();
}
function removeStaggered(count, token, done) {
  let i = 0;
  const step = () => {
    if (token !== seqToken) return;
    if (i >= count) { if (done) done(); return; }
    const f = frogs.pop();
    if (f) { f.classList.add("leaving"); setTimeout(() => f.remove(), 560); }
    updateCounter();
    i += 1;
    setTimeout(step, 320);
  };
  step();
}
function newProblem() {
  stopAudio();
  busy = true;
  celebrating = false;
  clearPond();
  resetTapCounts();
  problemEl.textContent = "";
  showMeBtn.disabled = true;
  newProbBtn.classList.remove("highlight");
  newProbBtn.disabled = true;
  promptEl.textContent = "Listen…";
  const token = seqToken;
  const add = Math.random() < 0.5;
  let a, b, answer;
  if (add) {
    a = 1 + Math.floor(Math.random() * 8);            // 1..8
    b = 1 + Math.floor(Math.random() * (10 - a));     // sum <= 10
    answer = a + b;
  } else {
    a = 3 + Math.floor(Math.random() * 8);            // 3..10
    b = 1 + Math.floor(Math.random() * (a - 1));      // answer >= 1
    answer = a - b;
  }
  math = { a, b, op: add ? "+" : "−", answer, phase: "building" };
  // Act 1: the starting frogs hop in while Aria says how many are in the pond.
  let spawned = false, spoken = false;
  const act2 = () => {
    if (!spawned || !spoken || token !== seqToken) return;
    setTimeout(() => {
      if (token !== seqToken) return;
      let moved = false, told = false;
      const ask = () => {
        if (!moved || !told || token !== seqToken) return;
        setTimeout(() => {
          if (token !== seqToken) return;
          problemEl.textContent = a + " " + math.op + " " + b + " = ?";
          promptEl.textContent = "Say it out loud!";
          math.phase = "asking";
          busy = false;
          newProbBtn.disabled = false;
          showMeBtn.disabled = false;
          play(add ? "how_many_now.mp3" : "how_many_left.mp3");
        }, 200);
      };
      if (add) {
        spawnStaggered(b, true, token, () => { moved = true; ask(); });
        playSeq(["num_" + b + ".mp3", "more_hop_in.mp3"], token, () => { told = true; ask(); });
      } else {
        removeStaggered(b, token, () => { moved = true; ask(); });
        playSeq(["num_" + b + ".mp3", "hop_away.mp3"], token, () => { told = true; ask(); });
      }
    }, 450);
  };
  spawnStaggered(a, false, token, () => { spawned = true; act2(); });
  playSeq(["num_" + a + ".mp3", "in_pond.mp3"], token, () => { spoken = true; act2(); });
}
function showMe() {
  if (!math || math.phase !== "asking" || busy) return;
  stopAudio();
  busy = true;
  showMeBtn.disabled = true;
  newProbBtn.disabled = true;
  resetTapCounts();
  promptEl.textContent = "Let's count together!";
  const token = seqToken;
  const targets = frogs.slice();
  playSeq(["lets_count.mp3"], token, () => {
    let i = 0;
    const step = () => {
      if (token !== seqToken) return;
      if (i >= targets.length) {
        problemEl.textContent = math.a + " " + math.op + " " + math.b + " = " + math.answer;
        promptEl.textContent = "Great counting!";
        math.phase = "revealed";
        busy = false;
        newProbBtn.disabled = false;
        newProbBtn.innerHTML = "▶️ Next problem!";
        newProbBtn.classList.add("highlight");
        confetti(30);
        playSeq(["num_" + math.answer + ".mp3", "great_counting.mp3"], token, null);
        return;
      }
      const f = targets[i];
      i += 1;
      tagFrog(f, i);
      hop(f);
      playSeq(["num_" + i + ".mp3"], token, () => setTimeout(step, 150));
    };
    setTimeout(step, 250);
  });
}
function resetMath() {
  stopAudio();
  busy = false;
  math = null;
  clearPond();
  resetTapCounts();
  problemEl.textContent = "";
  promptEl.textContent = "Tap New problem!";
  showMeBtn.disabled = true;
  newProbBtn.disabled = false;
  newProbBtn.innerHTML = "▶️ New problem!";
  newProbBtn.classList.remove("highlight");
}

// ---------------- shared wiring ----------------
function setMode(next) {
  if (next === mode) return;
  mode = next;
  document.getElementById("modeCountBtn").classList.toggle("on", mode === "count");
  document.getElementById("modeMathBtn").classList.toggle("on", mode === "math");
  countUI.hidden = mode !== "count";
  mathUI.hidden = mode !== "math";
  if (mode === "count") { resetCount(); }
  else { celebrating = false; resetMath(); play("frog_math.mp3"); }
}
pond.addEventListener("click", () => {
  if (mode === "count") {
    if (frogs.length >= 10) { if (!celebrating) celebrate(); return; }
    addFrog();
  } else if (math && math.phase === "asking" && !busy) {
    play(math.op === "+" ? "how_many_now.mp3" : "how_many_left.mp3");
  }
});
countBtn.addEventListener("click", () => {
  if (!frogs.length || celebrating) return;
  play("count_together.mp3");
});
againBtn.addEventListener("click", resetCount);
newProbBtn.addEventListener("click", newProblem);
showMeBtn.addEventListener("click", showMe);
document.getElementById("modeCountBtn").addEventListener("click", () => setMode("count"));
document.getElementById("modeMathBtn").addEventListener("click", () => setMode("math"));
document.getElementById("buddy").addEventListener("click", () =>
  play(mode === "count" ? "prompt_tap.mp3" : "frog_math.mp3"));
</script>
</body>
</html>
